<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="apple-itunes-app" content="app-id=6829497962">
  <title>Geteilte Notiz · 2nd Brain</title>
  <link rel="icon" href="icons/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <style>
    :root { --bg: #fbfaf7; --fg: #1d1d1b; --muted: #6f6b64; --line: #ebe8e1; --card: #fff; --accent: #1d1d1b; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --bg: #121212; --fg: #e9e7e2; --muted: #969390; --line: #262523; --card: #1a1a19; --accent: #e9e7e2; color-scheme: dark; } }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    main { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 40px) 24px calc(env(safe-area-inset-bottom) + 40px); }
    .head { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: .9rem; }
    .head img { width: 36px; height: 36px; border-radius: 9px; }
    .note { margin: 24px 0 8px; padding: 20px; background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      font-size: 1.05rem; white-space: pre-wrap; word-break: break-word; }
    .cat { color: var(--muted); font-size: .85rem; margin-bottom: 8px; }
    .btn { display: block; width: 100%; margin-top: 10px; padding: 13px; border-radius: 12px; text-align: center; text-decoration: none;
      font: inherit; font-weight: 550; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
    .btn.primary { margin-top: 20px; background: var(--accent); color: var(--bg); border-color: var(--accent); }
    .small { margin-top: 18px; font-size: .88rem; color: var(--muted); }
    .small a { color: var(--fg); }
    .lang { position: absolute; top: 16px; right: 16px; display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; font-size: .85rem; background: var(--card); }
    .lang a { padding: 5px 11px; text-decoration: none; color: var(--muted); }
    .lang a[aria-current] { background: var(--fg); color: var(--bg); }
    body { position: relative; }
    :focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
    .head { padding-right: 96px; } /* nicht unter den DE/EN-Schalter laufen */
  </style>
</head>
<body>
  <nav class="lang" aria-label="Sprache / Language"><a href="#" data-l="de" lang="de">DE</a><a href="#" data-l="en" lang="en">EN</a></nav>
  <main>
    <div class="head"><img src="icons/apple-touch-icon.png" alt=""><span data-de="Jemand hat dir eine Notiz aus &lt;b&gt;2nd Brain&lt;/b&gt; geschickt" data-en="Someone sent you a note from &lt;b&gt;2nd Brain&lt;/b&gt;">Jemand hat dir eine Notiz aus <b>2nd Brain</b> geschickt</span></div>
    <div id="note" class="note" aria-live="polite">Notiz wird geladen …</div>
    <div id="cat" class="cat" hidden></div>
    <a id="app" class="btn primary" hidden data-de="In 2nd Brain öffnen" data-en="Open in 2nd Brain">In 2nd Brain öffnen</a>
    <a class="btn" href="https://apps.apple.com/app/id6829497962" data-de="2nd Brain im App Store laden" data-en="Get 2nd Brain on the App Store">2nd Brain im App Store laden</a>
    <button id="copy" type="button" class="btn" hidden data-de="Text kopieren" data-en="Copy text">Text kopieren</button>
    <p class="small" data-de="„In 2nd Brain öffnen“ legt die Notiz als neue Notiz in deiner App ab. Die Notiz steckt nur in diesem Link, sie wird nirgends gespeichert. &lt;a href=&quot;./&quot;&gt;Mehr über 2nd Brain&lt;/a&gt;" data-en="“Open in 2nd Brain” adds the note as a new note in your app. The note lives only in this link – it isn’t stored anywhere. &lt;a href=&quot;en/&quot;&gt;More about 2nd Brain&lt;/a&gt;"></p>
  </main>
  <script type="module">
    import { decodeNote } from './js/share-codec.js';
    const code = location.hash.slice(1);
    const $ = id => document.getElementById(id);
    // Sprache: gewählt (localStorage) oder Browser; Umschalten ohne Neuladen.
    let L; try { L = localStorage.getItem('lang'); } catch {}
    L = L === 'de' || L === 'en' ? L : (/^de\b/i.test(navigator.language || '') ? 'de' : 'en');
    const T = (de, en) => (L === 'en' ? en : de);
    const paint = () => {
      document.documentElement.lang = L;
      document.title = T('Geteilte Notiz · 2nd Brain', 'Shared note · 2nd Brain');
      for (const el of document.querySelectorAll('[data-de]')) el.innerHTML = el.dataset[L];
      for (const a of document.querySelectorAll('.lang a')) a.toggleAttribute('aria-current', a.dataset.l === L);
    };
    for (const a of document.querySelectorAll('.lang a')) a.onclick = e => { e.preventDefault(); L = a.dataset.l; try { localStorage.setItem('lang', L); } catch {} paint(); };
    paint();
    // Einladung zu einer gemeinsamen Notiz (j…): Inhalt liegt nur in der App, hier nur der Weg dorthin.
    if (/^j[A-Za-z0-9]+_[a-z0-9]+$/.test(code)) {
      document.querySelector('.head span').dataset.de = 'Du wurdest eingeladen, eine Notiz in <b>2nd Brain</b> gemeinsam zu bearbeiten';
      document.querySelector('.head span').dataset.en = 'You’ve been invited to edit a note together in <b>2nd Brain</b>';
      $('note').dataset.de = 'Öffne diesen Link auf dem iPhone, iPad oder Mac mit 2nd Brain. Melde dich in der App an (Einstellungen → Cloud-Sync) – danach erscheint die gemeinsame Notiz. Gemeinsame Notizen gehören zu 2nd Brain Plus.';
      $('note').dataset.en = 'Open this link on your iPhone, iPad or Mac with 2nd Brain. Sign in in the app (Settings → Cloud sync) – the shared note will then appear. Shared notes are part of 2nd Brain Plus.';
      document.querySelector('p.small').dataset.de = 'Gemeinsame Notizen werden zwischen allen Beteiligten live abgeglichen. <a href="./">Mehr über 2nd Brain</a>';
      document.querySelector('p.small').dataset.en = 'Shared notes stay in sync live for everyone involved. <a href="en/">More about 2nd Brain</a>';
      $('app').href = `secondbrain://import?d=${code}`; $('app').hidden = false;
      paint();
    } else try {
      if (!/^[\w-]+$/.test(code)) throw new Error();
      const n = await decodeNote(code);
      $('note').textContent = n.text;
      if (n.category) { const c = n.category.replace(/[&<>"]/g, x => `&#${x.charCodeAt(0)};`); $('cat').dataset.de = `Kategorie: ${c}`; $('cat').dataset.en = `Category: ${c}`; paint(); $('cat').hidden = false; }
      $('app').href = `secondbrain://import?d=${code}`;
      $('copy').onclick = async () => {
        try { await navigator.clipboard.writeText(n.text); $('copy').textContent = T('Kopiert', 'Copied'); } catch { $('copy').textContent = T('Kopieren nicht möglich', 'Copying not possible'); }
      };
      $('app').hidden = false; $('copy').hidden = false;
    } catch {
      $('note').textContent = T('Dieser Link enthält keine gültige Notiz. Vielleicht wurde er beim Kopieren abgeschnitten.', 'This link doesn’t contain a valid note. Maybe it was cut off when copying.');
    }
  </script>
</body>
</html>
